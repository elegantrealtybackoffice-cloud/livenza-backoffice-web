<section class="settings-panel">
  <article class="settings-card">
    <div class="settings-section-title"><div><h2>Widgets</h2><p>Show or hide the supported Livenza widget panel from the top-bar Widgets control. Home stays clean until you ask for it.</p></div><button type="button" class="secondary" data-reset-widgets>Hide Widgets</button></div>
    <label class="widget-settings-card"><span class="widget-mini-icon">{{icons.symbol('widgets')}}</span><span><b>Show Home widgets</b><small>Quick Actions and build/status cards appear only when the Widgets control is opened.</small></span><span class="mac-switch"><input type="checkbox" data-pref="widgets.visible"><i></i></span></label>
    <p class="settings-note">Only widgets currently supported by the lightweight Home shell are exposed here. Unsupported weather or OS widgets are not simulated.</p>
  </article>
</section>
