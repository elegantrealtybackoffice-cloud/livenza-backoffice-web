services:
  - type: web
    name: livenza-back-office
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REVIEW_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_AADHAAR_MODEL
        value: gpt-5.6-luna
      - key: FORCE_HTTPS
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "64"
      - key: VIDEO_WALL_MAX_MB
        value: "2048"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: LIVENZA_ENV
        value: production
      - key: CUSTOMER_AUTH_TEST_MODE
        value: "0"
      - key: CASHFREE_TEST_STUB
        value: "0"
      - key: CASHFREE_ENVIRONMENT
        value: production
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: RADIUS_ENABLED
        value: "0"
      - key: RADIUS_TEST_STUB
        value: "0"
      - key: RADIUS_BASE_URL
        sync: false
      - key: RADIUS_AUTH_TOKEN
        sync: false
      - key: RADIUS_AUTH_HEADER
        value: Authorization
      - key: RADIUS_AUTH_SCHEME
        value: Bearer
      - key: RADIUS_SNAPSHOT_PATH
        sync: false
      - key: RADIUS_RECHARGE_PATH
        sync: false
      - key: RADIUS_STATUS_PATH
        sync: false
      # Legacy Razorpay webhook verification can remain configured during historical reconciliation only.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STAFF_ATTENDANCE_WEBHOOK_TOKEN
        sync: false
      - key: LIVENZA_PRIVATE_BUCKET
        value: livenza-private
      - key: LIVENZA_PUBLIC_BUCKET
        value: livenza-public

