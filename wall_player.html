<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#000"><title>{{screen.name}} • Livenza Video Wall</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{position:fixed;inset:0;background:#000;display:grid;place-items:center;overflow:hidden}.media{position:absolute;left:50%;top:50%;transform-origin:center center;max-width:none;max-height:none;background:#000}.empty{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#20253b 0,#08090d 46%,#000 100%);text-align:center}.empty h1{font-size:clamp(28px,5vw,64px);margin:0}.empty p{color:#9da3b4}.hud{position:fixed;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;align-items:center;z-index:20;pointer-events:none;opacity:.85}.chip{padding:9px 14px;border:1px solid #ffffff2e;background:#11182799;border-radius:999px;backdrop-filter:blur(18px);font-size:12px}.live{color:#73f5a8}.festive{color:#ffd66b}.full{position:fixed;right:18px;bottom:18px;z-index:30;border:1px solid #ffffff33;background:#111827c7;color:white;border-radius:999px;padding:10px 16px;cursor:pointer;backdrop-filter:blur(18px)}@media(hover:none){.full{font-size:16px;padding:14px 20px}}</style></head><body><div class="stage"><video id="vid" class="media" playsinline></video><img id="img" class="media" alt=""><div id="empty" class="empty"><div><h1>{{screen.name}}</h1><p>Connected to Livenza Video Wall Studio<br>Waiting for media command…</p></div></div></div><div class="hud"><div class="chip"><span class="live">● LIVE</span> &nbsp; {{screen.name}}</div><div id="mode" class="chip">INDIVIDUAL</div></div><button class="full" onclick="document.documentElement.requestFullscreen?.();this.style.display='none'">Full Screen</button><script>
const token={{screen.player_token|tojson}},vid=document.getElementById('vid'),img=document.getElementById('img'),empty=document.getElementById('empty'),mode=document.getElementById('mode');let state=null,playlistKey='',idx=0,slideTimer=null;
function layout(el,deg,fit){deg=((deg%360)+360)%360;el.style.objectFit=fit||'contain';el.style.transform=`translate(-50%,-50%) rotate(${deg}deg)`;if(deg===90||deg===270){el.style.width='100vh';el.style.height='100vw'}else{el.style.width='100vw';el.style.height='100vh'}}
function clearSlide(){if(slideTimer){clearTimeout(slideTimer);slideTimer=null}}
function advance(){if(!state||!state.playlist||!state.playlist.length)return;let next=idx+1;if(next>=state.playlist.length){if(!state.loop)return;next=0}idx=next;showCurrent(true)}
function showCurrent(force=false){clearSlide();if(!state||!state.screen.enabled||!state.playlist||!state.playlist.length){vid.pause();vid.style.display='none';img.style.display='none';empty.style.display='grid';return}empty.style.display='none';const a=state.playlist[idx]||state.playlist[0];if(a.type==='image'){vid.pause();vid.style.display='none';img.style.display='block';layout(img,state.rotation,state.fit);if(force||img.src!==a.url)img.src=a.url;if(state.playlist.length>1)slideTimer=setTimeout(advance,(state.slide_duration||10)*1000)}else{img.style.display='none';vid.style.display='block';layout(vid,state.rotation,state.fit);vid.loop=!!state.loop&&state.playlist.length===1;vid.muted=!!state.muted;if(force||vid.src!==a.url){vid.src=a.url;vid.load()}vid.play().catch(()=>{})}}
vid.addEventListener('ended',()=>{if(state&&state.playlist&&state.playlist.length>1)advance()});
async function sync(){try{const r=await fetch(`/api/wall/${token}/state`,{cache:'no-store'});if(!r.ok)return;const s=await r.json();mode.textContent=s.festive?`FESTIVE • ${s.festive.name}`:'INDIVIDUAL';mode.className='chip '+(s.festive?'festive':'');const nk=JSON.stringify({ids:(s.playlist||[]).map(x=>x.id),rot:s.rotation,fit:s.fit,loop:s.loop,muted:s.muted,festive:s.festive?s.festive.id:0,enabled:s.screen.enabled,dur:s.slide_duration});state=s;if(nk!==playlistKey){playlistKey=nk;idx=0;showCurrent(true)}else if(state.playlist&&state.playlist[idx]){layout(state.playlist[idx].type==='image'?img:vid,state.rotation,state.fit)}}catch(e){}}
async function beat(){try{await fetch(`/api/wall/${token}/heartbeat`,{method:'POST'})}catch(e){}}
sync();beat();setInterval(sync,2500);setInterval(beat,30000);document.addEventListener('click',()=>vid.play().catch(()=>{}));
</script></body></html>
