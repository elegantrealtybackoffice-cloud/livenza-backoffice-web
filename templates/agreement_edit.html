{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">AGREEMENT BUILDER</p><h1>{{'Edit Agreement' if ag else 'New Agreement'}}</h1></div></div>
<form method="post" class="form-card" id="agreementForm"><div class="form-grid">
<label class="span2">Agreement Preset<select name="agreement_template" id="presetSelect">{% for n in presets %}<option {{'selected' if d.get('agreement_template')==n else ''}}>{{n}}</option>{% endfor %}</select></label>
<label>Agreement Reference<input name="agreement_reference" value="{{d.get('agreement_reference','')}}"></label><label>Agreement Date<input name="agreement_date" value="{{d.get('agreement_date','')}}"></label>
<label>Start Date<input name="start_date" id="startDate" value="{{d.get('start_date','')}}" placeholder="YYYY-MM-DD"></label><label>Term (months)<input name="term_months" id="termMonths" value="{{d.get('term_months','')}}"></label><label>End Date<input name="end_date" id="endDate" value="{{d.get('end_date','')}}"></label><div class="calcbox"><button type="button" class="secondary" id="calcEnd">Calculate End Date</button></div>
</div><details open><summary>Parties & Tenant</summary><div class="form-grid"><label>Landlord / Management<input name="landlord_name" value="{{d.get('landlord_name','')}}"></label><label>Entity<input name="landlord_entity" value="{{d.get('landlord_entity','Livenza Life LLP')}}"></label><label>Tenant / Guest<input name="tenant_name" value="{{d.get('tenant_name','')}}" required></label><label>Mobile<input name="tenant_mobile" value="{{d.get('tenant_mobile','')}}"></label><label>WhatsApp<input name="tenant_whatsapp" value="{{d.get('tenant_whatsapp','')}}"></label><label>Email<input name="tenant_email" value="{{d.get('tenant_email','')}}"></label><label>ID Type<input name="tenant_id_type" value="{{d.get('tenant_id_type','Aadhaar')}}"></label><label>ID Number<input name="tenant_id_no" value="{{d.get('tenant_id_no','')}}"></label></div></details>
<details open><summary>Property & Financial Terms</summary><div class="form-grid"><label>Property Name<input name="property_name" value="{{d.get('property_name','')}}"></label><label>Room / Unit No.<input name="room_unit_no" value="{{d.get('room_unit_no','')}}"></label><label class="span2">Full Address<textarea name="premises">{{d.get('premises','')}}</textarea></label><label>Room Type<input name="room_type" value="{{d.get('room_type','')}}"></label><label>Monthly Rent / Tariff<input name="monthly_rent" value="{{d.get('monthly_rent','')}}"></label><label>Security Deposit<input name="security_deposit" value="{{d.get('security_deposit','')}}"></label><label>Lock-in Months<input name="lockin_months" value="{{d.get('lockin_months','')}}"></label><label>Notice Days<input name="notice_days" value="{{d.get('notice_days','')}}"></label><label>Escalation %<input name="increment_percent" value="{{d.get('increment_percent','')}}"></label><label>Electricity<input name="electricity_rate" value="{{d.get('electricity_rate','')}}"></label><label>Generator / DG<input name="genset_rate" value="{{d.get('genset_rate','')}}"></label></div></details>
<details><summary>Foreign Client / Regulatory</summary><div class="form-grid"><label>Foreign Status<input name="foreign_status" value="{{d.get('foreign_status','')}}"></label><label>Nationality<input name="foreign_nationality" value="{{d.get('foreign_nationality','')}}"></label><label>Passport No.<input name="passport_no" value="{{d.get('passport_no','')}}"></label><label>Passport Expiry<input name="passport_expiry" value="{{d.get('passport_expiry','')}}"></label><label>Visa / OCI No.<input name="visa_oci_no" value="{{d.get('visa_oci_no','')}}"></label><label>Visa Type<input name="visa_type" value="{{d.get('visa_type','')}}"></label><label>Visa Expiry<input name="visa_expiry" value="{{d.get('visa_expiry','')}}"></label><label>FRRO / FRO No.<input name="frro_registration_no" value="{{d.get('frro_registration_no','')}}"></label><label>Tenant Verification Ref.<input name="tenant_verification_ref" value="{{d.get('tenant_verification_ref','')}}"></label><label>Fire NOC No.<input name="fire_noc_no" value="{{d.get('fire_noc_no','')}}"></label></div></details>
<details><summary>Special Terms</summary><textarea name="special_terms" rows="8">{{d.get('special_terms','')}}</textarea></details>
<div class="sticky-actions"><button name="save_lang" value="en" class="primary">Save & Preview English</button><button name="save_lang" value="hi" class="secondary">Save & Preview हिंदी</button></div></form>{% endblock %}
{% block scripts %}<script>window.PRESET_URL='{{url_for("preset_api",name="__NAME__")}}';</script>{% endblock %}
