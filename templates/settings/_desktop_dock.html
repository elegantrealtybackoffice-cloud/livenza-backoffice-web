<section class="settings-panel">
  <article class="settings-card">
    <div class="settings-section-title"><div><h2>Desktop &amp; Dock</h2><p>Adjust the live Dock. Every control on this page changes the actual desktop Dock.</p></div></div>
    <div class="form-grid">
      <label>Dock size<select data-pref="dock.size"><option value="small">Small</option><option value="regular" selected>Regular</option><option value="large">Large</option></select></label>
    </div>
    <div class="settings-toggle-list">
      <label class="settings-toggle-row"><span><b>Magnification</b><small>Enlarge the pointer-nearest app and its neighbours.</small></span><span class="mac-switch"><input type="checkbox" data-pref="dock.magnification" checked><i></i></span></label>
      <label class="settings-toggle-row"><span><b>Automatically hide and show the Dock</b><small>Reveal the Dock when the pointer reaches the bottom edge.</small></span><span class="mac-switch"><input type="checkbox" data-pref="dock.autohide"><i></i></span></label>
    </div>
  </article>
</section>
