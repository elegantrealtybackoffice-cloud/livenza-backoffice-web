<section class="settings-panel">
  <article class="settings-card settings-wallpaper-card">
    <div class="settings-section-title"><div><h2>Wallpaper</h2><p>Choose the desktop background used on Home. Your selection is applied before first paint and stays on this browser.</p></div></div>
    <div class="wallpaper-grid" role="radiogroup" aria-label="Desktop wallpaper">
      <button type="button" class="wallpaper-choice" data-wallpaper-value="livenza-life" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-livenza-life" aria-hidden="true"></span><span class="wallpaper-choice-copy"><b>Livenza.life · Live Elevated</b><small>Official navy, emerald and cyan signature wallpaper</small></span></button>
      <button type="button" class="wallpaper-choice" data-wallpaper-value="aurora" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-aurora" aria-hidden="true"></span><span class="wallpaper-choice-copy"><b>Livenza Aurora</b><small>Navy, emerald and cyan liquid light</small></span></button>
      <button type="button" class="wallpaper-choice" data-wallpaper-value="spectrum" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-spectrum" aria-hidden="true"></span><span class="wallpaper-choice-copy"><b>Spectrum</b><small>Vivid violet, blue and coral</small></span></button>
      <button type="button" class="wallpaper-choice" data-wallpaper-value="sequoia" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-sequoia" aria-hidden="true"></span><span class="wallpaper-choice-copy"><b>Sequoia</b><small>Cool teal and indigo depth</small></span></button>
      <button type="button" class="wallpaper-choice" data-wallpaper-value="midnight" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-midnight" aria-hidden="true"></span><span class="wallpaper-choice-copy"><b>Midnight</b><small>Deep blue low-light desktop</small></span></button>
      <button type="button" class="wallpaper-choice" data-wallpaper-value="livenza-blue" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-livenza-blue" aria-hidden="true"></span><span class="wallpaper-choice-copy"><b>Livenza Blue</b><small>Electric blue hospitality glow</small></span></button>
      <button type="button" class="wallpaper-choice" data-wallpaper-value="violet-glass" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-violet-glass" aria-hidden="true"></span><span class="wallpaper-choice-copy"><b>Violet Glass</b><small>Violet, rose and liquid depth</small></span></button>
      <button type="button" class="wallpaper-choice" data-wallpaper-value="ocean" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-ocean" aria-hidden="true"></span><span class="wallpaper-choice-copy"><b>Ocean</b><small>Cyan waves over midnight blue</small></span></button>
      <button type="button" class="wallpaper-choice" data-wallpaper-value="sunrise" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-sunrise" aria-hidden="true"></span><span class="wallpaper-choice-copy"><b>Sunrise</b><small>Coral, gold and violet morning</small></span></button>
      <button type="button" class="wallpaper-choice wallpaper-custom-choice" data-wallpaper-value="custom" role="radio" aria-checked="false"><span class="wallpaper-preview wallpaper-custom" aria-hidden="true"><span>+</span></span><span class="wallpaper-choice-copy"><b>Custom</b><small>Use your own image</small></span></button>
    </div>
    <div class="wallpaper-custom-controls">
      <label class="wallpaper-upload-button" for="wallpaperCustomInput">Choose Photo</label>
      <input id="wallpaperCustomInput" type="file" accept="image/jpeg,image/png,image/webp,image/avif" hidden>
      <button type="button" class="secondary wallpaper-remove-button" data-wallpaper-remove-custom>Remove Custom</button>
      <small id="wallpaperStatus" class="settings-note" aria-live="polite">Custom images are resized locally; nothing is uploaded to the server.</small>
    </div>
    <div class="wallpaper-layout-controls">
      <div class="form-grid">
        <label>Image scaling<select data-pref="wallpaper.fit"><option value="fill">Fill Screen</option><option value="fit">Fit to Screen</option><option value="stretch">Stretch to Fill</option><option value="center">Center at Natural Size</option></select></label>
        <label>Zoom <output data-pref-output="wallpaper.zoom">100%</output><input type="range" min="80" max="160" step="1" value="100" data-pref="wallpaper.zoom"></label>
        <label>Horizontal position <output data-pref-output="wallpaper.positionX">50%</output><input type="range" min="0" max="100" step="1" value="50" data-pref="wallpaper.positionX"></label>
        <label>Vertical position <output data-pref-output="wallpaper.positionY">50%</output><input type="range" min="0" max="100" step="1" value="50" data-pref="wallpaper.positionY"></label>
      </div>
      <p class="settings-note">Fill, Fit, Stretch and Center apply instantly on Home. Position and zoom are saved on this browser.</p>
    </div>
  </article>
</section>
