<section class="settings-panel"><article class="settings-card"><h2>Wallpaper</h2><div class="wallpaper-grid">{% for key,label in [('warm','Warm Curves'),('sand','Sand Glass'),('champagne','Champagne Reflection')] %}<button type="button" class="wallpaper-choice" data-pref-button="wallpaper.variant" data-value="{{key}}"><span class="wallpaper-preview {{key}}"></span><b>{{label}}</b></button>{% endfor %}</div></article></section>
