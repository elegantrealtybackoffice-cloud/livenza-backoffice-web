<section class="settings-panel">
  <article class="settings-card">
    <div class="settings-section-title"><div><h2>Appearance</h2><p>Use the macOS 27 light or dark application material while keeping the desktop wallpaper vibrant.</p></div></div>
    <div class="appearance-samples" role="group" aria-label="Appearance mode">
      <button type="button" class="appearance-sample" data-pref-button="appearance.mode" data-value="auto" aria-pressed="false"><span class="appearance-preview macos27-auto"></span><b>Automatic</b><small>Follow this device</small></button>
      <button type="button" class="appearance-sample" data-pref-button="appearance.mode" data-value="light" aria-pressed="false"><span class="appearance-preview macos27-light"></span><b>Light</b><small>Bright app surfaces</small></button>
      <button type="button" class="appearance-sample" data-pref-button="appearance.mode" data-value="dark" aria-pressed="false"><span class="appearance-preview macos27-dark"></span><b>Dark</b><small>Dark app surfaces</small></button>
    </div>
    <div class="settings-toggle-list">
      <label class="settings-toggle-row"><span><b>Increase contrast</b><small>Strengthen separators and secondary text while keeping the same layout.</small></span><span class="mac-switch"><input type="checkbox" data-pref="appearance.contrast"><i></i></span></label>
      <label class="settings-toggle-row"><span><b>Reduce transparency</b><small>Use more opaque menu, Dock, widget and popover materials.</small></span><span class="mac-switch"><input id="settingsReduceTransparency" type="checkbox" data-pref="appearance.reduceTransparency"><i></i></span></label>
    </div>
  </article>
</section>
