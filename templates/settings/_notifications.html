<section class="settings-panel"><article class="settings-card"><h2>Notifications</h2><p>Choose which browser-side Livenza alerts can interrupt you.</p><div class="settings-toggle-list">{% for key,label in [('notifications.operational','Operational alerts'),('notifications.badges','App badges'),('notifications.companion','Companion notices'),('notifications.reminders','Reminders')] %}<label class="settings-toggle-row"><span>{{label}}</span><span class="mac-switch"><input type="checkbox" data-pref="{{key}}" checked><i></i></span></label>{% endfor %}</div></article></section>
