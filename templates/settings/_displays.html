<section class="settings-panel"><article class="settings-card"><h2>Displays</h2><p>Interface brightness changes Livenza only; browsers cannot control the physical monitor brightness.</p><label class="settings-range-row"><span>Interface brightness</span><input id="settingsLuminance" type="range" min="70" max="115" value="100" data-pref="display.luminance"></label><div class="form-grid"><label>Interface scale<select data-pref="display.scale"><option value="auto">Automatic</option><option value="compact">More Space</option><option value="large">Larger Text</option></select></label><label>Fullscreen behavior<select data-pref="display.fullscreen"><option value="native">Native when available</option><option value="theatre">Theatre fallback</option></select></label></div></article></section>
