{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">LEGAL OPERATIONS</p><h1>Agreement Studio</h1></div><a class="primary btn" href="{{url_for('agreement_edit')}}">+ New Agreement</a></div>
<div class="table-card"><table><thead><tr><th>Agreement</th><th>Preset</th><th>Updated</th><th>Actions</th></tr></thead><tbody>{% for a in items %}<tr><td><b>{{a.name}}</b></td><td>{{a.preset}}</td><td>{{a.updated_at.strftime('%d %b %Y %H:%M')}}</td><td class="actions"><a href="{{url_for('agreement_preview',aid=a.id)}}">English</a><a href="{{url_for('agreement_preview',aid=a.id,lang='hi')}}">हिंदी</a><a href="{{url_for('agreement_edit',aid=a.id)}}">Edit</a><form method="post" action="{{url_for('agreement_delete',aid=a.id)}}" onsubmit="return confirm('Delete agreement?')"><button class="link danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="4" class="empty">No agreements yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
